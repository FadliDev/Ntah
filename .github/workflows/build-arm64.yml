name: Build arm64 debug
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo tidak punya gradlew, jadi pasang Gradle yang sama dengan wrapper asli Zalith
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build JRE JAR (dibutuhkan modul utama)
        run: gradle jre_lwjgl3glfw:build --no-daemon

      - name: Build APK debug arm64
        run: gradle ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Blokku-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
