name: Build Sallygram APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Checkout Sallygram
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install native build dependencies and Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build gperf php-cli perl python3
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew || { echo "::error::gradlew missing at repository root"; exit 1; }
          test -f ./scripts/prepare-tdlib.sh || { echo "::error::scripts/prepare-tdlib.sh missing"; exit 1; }
          test -f ./app/build.gradle.kts || { echo "::error::app/build.gradle.kts missing"; exit 1; }

      # Restore TDLib sources/build intermediates and generated outputs.
      - name: Restore TDLib cache
        id: tdlib-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            tdlib/
            app/src/main/jniLibs/
            app/src/main/java/org/drinkless/tdlib/
            .tdlib-build/
          key: tdlib-${{ runner.os }}-android35-${{ hashFiles('scripts/prepare-tdlib.sh') }}
          restore-keys: |
            tdlib-${{ runner.os }}-android35-

      # Exact cache hit means native libraries were already built by a successful
      # run with the same preparation script, so skip the expensive native compile.
      # On a partial/old cache restore, rerun the script so it can reuse intermediates.
      - name: Build TDLib for Android
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/prepare-tdlib.sh
          ./scripts/prepare-tdlib.sh

      - name: Verify cached or built TDLib outputs
        shell: bash
        run: |
          set -euo pipefail
          if ! find app/src/main/jniLibs tdlib .tdlib-build -type f -name '*.so' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::No TDLib native .so output found in expected output/cache directories."
            echo "Inspect scripts/prepare-tdlib.sh and add its actual output directory to the cache paths."
            exit 1
          fi
          if ! find app/src/main/java tdlib .tdlib-build -type f -name 'TdApi.java' -print -quit 2>/dev/null | grep -q .; then
            echo "::warning::TdApi.java was not found in common paths; continuing because this project may provide the binding differently."
          fi

      # Save before Gradle. This preserves the expensive native build even if the
      # Kotlin/Gradle APK step fails later in the same workflow.
      - name: Save TDLib cache
        if: success() && steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            tdlib/
            app/src/main/jniLibs/
            app/src/main/java/org/drinkless/tdlib/
            .tdlib-build/
          key: tdlib-${{ runner.os }}-android35-${{ hashFiles('scripts/prepare-tdlib.sh') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sallygram-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
